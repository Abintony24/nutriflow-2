apiVersion: v1
kind: Service
metadata:
  name: nutriflow-backend-service
spec:
  type: ClusterIP
  selector:
    app: nutriflow-backend
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: nutriflow-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: nutriflow-frontend
  ports:
    - port: 80
      targetPort: 80
